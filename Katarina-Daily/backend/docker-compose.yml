services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fashion_store
    ports:
      - "5432:5432"
    volumes:
      - fashion_store_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8090
      DATABASE_URL: postgresql://postgres:password@postgres:5432/fashion_store
      JWT_SECRET: change_me
      JWT_EXPIRY_HOURS: "72"
      PAYMENT_GATEWAY: midtrans
      PAYMENT_SERVER_KEY: ""
      PAYMENT_CLIENT_KEY: ""
      PAYMENT_ENVIRONMENT: sandbox
      SHIPPING_API_KEY: ""
      SHIPPING_ORIGIN_CITY: "Jakarta Selatan"
      SHIPPING_ORIGIN_PROVINCE: "DKI Jakarta"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5174"
      RATE_LIMIT_PER_MINUTE: "120"
    ports:
      - "8090:8090"

volumes:
  fashion_store_pgdata:
